[package]
name = "anti-whale-hook"
version = "0.1.0"
edition = "2021"
description = "Token-2022 transfer hook enforcing a per-transfer anti-whale limit"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
pinocchio = { version = "0.11.2", default-features = false, features = ["cpi"] }
pinocchio-system = "0.6.1"
solana-address = { version = "2.7", features = ["sha2", "syscalls"] }

# `find_program_address` is a syscall on-chain; the host build (used by
# `cargo test` to compile the library) needs the curve25519 implementation.
[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-address = { version = "2.7", features = ["curve25519"] }

[dev-dependencies]
litesvm = "0.18"
mollusk-svm = "0.16"
sha2 = "0.10"
solana-account = "4.7"
solana-instruction = "3.5"
solana-keypair = "3.1"
solana-message = "4.6"
solana-program-error = "3.0"
solana-pubkey = "4.3"
solana-signer = "3.0"
solana-transaction = "4.3"
solana-transaction-error = "3.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[workspace]
